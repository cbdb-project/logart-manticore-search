#
# Manticore config for LoGaRT full-text search (production).
# Install to /etc/manticoresearch/manticore.conf  (back up the package default first).
#
# Validated on a 100k-page sample against MySQL 8.0.46 (see docs/operations.md):
#  - ngram_len=1 over CJK, positions stored -> phrase search without re-reading rows
#  - spaces / U+3000 / ○ / ∈ / ? are separators -> transparent inside a phrase
#    (MySQL: U+3000 and ∈ break the phrase, so Manticore finds a few more true hits)
#  - punctuation in phrase_boundary stops a phrase (same as MySQL); logart_tsv.py
#    inserts a space after these chars because Manticore only honours a boundary
#    char that is followed by a separator
#  - Private Use Area chars (U+E000..F8FF, missing-glyph placeholders) are indexed as
#    one character each so they occupy a position
#
# Nothing is stored for display: MySQL keeps serving the text, Manticore only returns ids.
#

source logart_pages
{
    type                = tsvpipe
    tsvpipe_command     = /usr/bin/python3 /etc/manticoresearch/logart_tsv.py
    tsvpipe_field       = content
    tsvpipe_attr_string = book_id
    tsvpipe_attr_bigint = page_no
}

table pages
{
    source               = logart_pages
    path                 = /var/lib/manticore/pages
    charset_table        = non_cjk
    ngram_len            = 1
    ngram_chars          = cjk, U+E000..U+F8FF
    phrase_boundary      = U+3002, U+FF0C, U+3001, U+FF1B, U+FF1A, U+FF01, U+FF1F, U+300C, U+300D, U+300E, U+300F, U+FF08, U+FF09, U+300A, U+300B, U+3008, U+3009, U+002C, U+002E, U+003B, U+003A, U+0021, U+3010, U+3011, U+3014, U+3015, U+005B, U+005D, U+0028, U+0029, U+FF3B, U+FF3D
    phrase_boundary_step = 100
    # default would store every text field (+40% disk); we only need ids back
    stored_fields        =
}

indexer
{
    mem_limit = 256M
}

searchd
{
    # localhost only: MySQL reaches it through the FEDERATED table mt_pages
    listen                = 127.0.0.1:9306:mysql
    log                   = /var/log/manticore/searchd.log
    query_log             = /var/log/manticore/query.log
    pid_file              = /run/manticore/searchd.pid
    # no Buddy (PHP sidecar) - not needed, saves memory
    buddy_path            =
    max_threads_per_query = 1
    # MUST be long. MySQL FEDERATED caches its connections to us; the default (5 min) drops idle ones,
    # libmysqlclient then auto-reconnects and sends "SET NAMES utf8mb4", which Manticore rejects for the
    # FEDERATED user ("unhandled statement type") -> every keyword search fails with 1430 /
    # "Lost connection to MySQL server during query" until MySQL opens fresh handlers
    # (FLUSH TABLES gazetteer.mt_pages). See docs/operations.md "Troubleshooting".
    # NOTE: this only covers client_timeout; the SQL-session wait_timeout (8 h) still applies,
    # which is why cron/logart-mt-flush is also required.
    client_timeout        = 365d
}
