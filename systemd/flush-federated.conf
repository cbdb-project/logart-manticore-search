# systemd drop-in for manticore.service
# Install:  sudo install -D -m 644 flush-federated.conf /etc/systemd/system/manticore.service.d/flush-federated.conf
#           sudo systemctl daemon-reload
#
# After Manticore (re)starts, every FEDERATED connection MySQL has cached is dead. Drop them so the
# next search opens a fresh one. The leading '-' means a failure (e.g. MySQL not up yet at boot,
# when there is nothing cached anyway) does not fail the Manticore start.
# Credentials: the same [client] option file the indexer uses (owner manticore, mode 600).
[Service]
ExecStartPost=-/usr/bin/mysql --defaults-extra-file=/etc/manticoresearch/logart-mysql.cnf -e "FLUSH TABLES gazetteer.mt_pages"
